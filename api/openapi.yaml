openapi: 3.0.3
info:
  title: Webhook Delivery API
  version: 0.1.0
  description: |
    Register endpoints, publish events, and inspect deliveries. Delivery is at-least-once
    and unordered; receivers should deduplicate on the `webhook-id` header (the event id).
servers:
  - url: http://localhost:8080
# Every response carries an `X-Request-Id` (a caller-supplied one is echoed back) and the service
# continues an incoming W3C `traceparent`, so a request can be followed through logs and traces.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: "Tenant API key (whk_...)" }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties: { code: { type: string }, message: { type: string } }
    Endpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string }
        event_types: { type: array, items: { type: string }, description: 'Event types to receive; "*" matches all.' }
        status: { type: string, enum: [active, paused, disabled] }
        max_concurrency: { type: integer, minimum: 1, maximum: 100, description: "Deliveries allowed in flight to this endpoint at once (default 5)" }
        health:
          type: object
          description: Circuit breaker state. While circuit_open_until is in the future the endpoint is not attempted.
          properties:
            consecutive_failures: { type: integer }
            failing_since: { type: string, format: date-time, nullable: true }
            circuit_open_until: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, description: "Set when auto-disabled after failing continuously" }
        disabled_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        secret: { type: string, description: Signing secret; returned only when the endpoint is created. }
    Delivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, in_flight, succeeded, dead] }
        attempt_count: { type: integer }
        last_status_code: { type: integer, nullable: true }
        last_error: { type: string, nullable: true }
        next_attempt_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        dead_at: { type: string, format: date-time, nullable: true }
        dead_reason: { type: string, nullable: true, enum: [max_attempts, endpoint_gone, endpoint_disabled, lease_expired] }
    SecretInfo:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true, description: "Set while the secret is in its rotation grace period" }
    Attempt:
      type: object
      properties:
        attempt_no: { type: integer }
        started_at: { type: string, format: date-time }
        duration_ms: { type: integer, nullable: true }
        status_code: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        response_body_snippet: { type: string, nullable: true }
    DeliveryDetail:
      allOf:
        - $ref: '#/components/schemas/Delivery'
        - type: object
          properties:
            event_id: { type: string, format: uuid }
            event_type: { type: string }
            max_attempts: { type: integer }
            attempts: { type: array, items: { $ref: '#/components/schemas/Attempt' } }
    DeadDelivery:
      type: object
      properties:
        delivery_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        endpoint_id: { type: string, format: uuid }
        reason: { type: string, enum: [max_attempts, endpoint_gone, endpoint_disabled, lease_expired] }
        attempt_count: { type: integer }
        last_status_code: { type: integer, nullable: true }
        last_error: { type: string, nullable: true }
        dead_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
paths:
  /v1/endpoints:
    post:
      summary: Create an endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: "https URL (http allowed only in dev)" }
                description: { type: string }
                event_types: { type: array, items: { type: string }, default: ["*"] }
                secret: { type: string, description: "Optional whsec_ secret (base64, 16-64 bytes); generated if omitted" }
                max_concurrency: { type: integer, minimum: 1, maximum: 100, default: 5 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Endpoint' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    get:
      summary: List endpoints (keyset pagination)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: after, in: query, schema: { type: string, format: uuid }, description: "Endpoint id to continue after (use next_after)" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Endpoint' } }
                  next_after: { type: string, nullable: true }
  /v1/endpoints/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get an endpoint
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Endpoint' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update an endpoint (pause/resume, change URL or subscriptions)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                description: { type: string }
                event_types: { type: array, items: { type: string } }
                status: { type: string, enum: [active, paused], description: "Setting active also re-enables an auto-disabled endpoint and resets its circuit breaker" }
                max_concurrency: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Endpoint' } } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete an endpoint and its deliveries
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /v1/endpoints/{id}/secrets:
    get:
      summary: List the endpoint's signing secrets (metadata only, never values)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SecretInfo' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/endpoints/{id}/secrets/rotate:
    post:
      summary: Rotate the signing secret
      description: |
        Adds a new secret. For the grace period the previous secret keeps signing too and every delivery carries
        a signature for each live secret, so the receiver can switch over with no failed deliveries.
        `grace_period: "0s"` retires every previous secret immediately (hard rotation after a compromise).
        The new secret is returned once.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_period: { type: string, example: 24h, description: "Go duration, 0s to 168h; default 24h" }
                secret: { type: string, description: "Optional whsec_ secret; generated if omitted" }
      responses:
        '201':
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  secret: { type: string }
                  created_at: { type: string, format: date-time }
                  secrets: { type: array, items: { $ref: '#/components/schemas/SecretInfo' } }
        '409': { description: Too many live secrets, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/endpoints/{id}/secrets/{secretId}:
    delete:
      summary: Revoke one secret immediately
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: secretId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: The last live secret cannot be revoked, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/events:
    post:
      summary: Publish an event
      description: Fans out to every active endpoint subscribed to the type. Send `Idempotency-Key` to make retries safe.
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, payload]
              properties:
                type: { type: string, example: invoice.paid }
                payload: { type: object, description: "Up to 256KB" }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, deliveries: { type: integer }, duplicate: { type: boolean } }
        '200': { description: Duplicate Idempotency-Key; the original event is returned }
        '413': { $ref: '#/components/responses/Error' }
        '503':
          description: |
            The service could not reach its database in time (each request has a deadline, default 5s).
            Retry after the delay in `Retry-After`, with the same `Idempotency-Key`.
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: |
            Over the tenant's quota: `rate_limited` (events per second) or `backlog_full` (too many undelivered
            events queued). Retry after the delay in `Retry-After`; an `Idempotency-Key` makes retries safe.
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds to wait before retrying }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/events/{id}/deliveries:
    get:
      summary: Delivery status for an event
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Delivery' } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/deliveries/{id}:
    get:
      summary: One delivery with its full attempt history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/deliveries/{id}/replay:
    post:
      summary: Replay one dead-lettered delivery
      description: Resets the attempt budget and requeues it immediately. History is kept and the replay is audited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Requeued, content: { application/json: { schema: { type: object, properties: { replayed: { type: integer } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: The delivery is not in the DLQ, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/dlq:
    get:
      summary: List dead-lettered deliveries (newest first)
      parameters:
        - { name: endpoint_id, in: query, schema: { type: string, format: uuid } }
        - { name: reason, in: query, schema: { type: string, enum: [max_attempts, endpoint_gone, endpoint_disabled, lease_expired] } }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: "Only entries dead-lettered at or after this time" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: after, in: query, schema: { type: string }, description: "Opaque cursor from next_after" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DeadDelivery' } }
                  next_after: { type: string, nullable: true }
  /v1/dlq/replay:
    post:
      summary: Replay dead-lettered deliveries in bulk
      description: |
        Requeues up to `limit` matching deliveries. Their due times are staggered so they are sent at
        about `rate_per_second`, so a replay does not swamp a receiver that has only just recovered.
        Call again to continue if more remain.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint_id: { type: string, format: uuid }
                reason: { type: string, enum: [max_attempts, endpoint_gone, endpoint_disabled, lease_expired] }
                since: { type: string, format: date-time }
                limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
                rate_per_second: { type: number, exclusiveMinimum: 0, maximum: 1000, default: 10 }
      responses:
        '202': { description: Requeued, content: { application/json: { schema: { type: object, properties: { replayed: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/Error' }
