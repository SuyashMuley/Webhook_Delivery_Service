services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., args: { CMD: migrate } }
    environment: &env
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      APP_ENV: dev
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., args: { CMD: api } }
    environment: *env
    ports:
      - "8080:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., args: { CMD: worker } }
    environment: *env
    ports:
      - "8081:8081"
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
