apiVersion: v1
kind: Namespace
metadata:
  name: receiver
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: receiver, namespace: receiver }
spec:
  replicas: 1
  selector:
    matchLabels: { app: receiver }
  template:
    metadata:
      labels: { app: receiver }
    spec:
      containers:
        - name: receiver
          image: webhook-delivery-mockreceiver:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RECEIVER_SECRET   # public dev value: register endpoints with this secret
              value: whsec_ZGV2LW9ubHktcmVjZWl2ZXItc2VjcmV0LTAxMjM0NTY=
          ports:
            - { name: http, containerPort: 9000 }
---
apiVersion: v1
kind: Service
metadata: { name: receiver, namespace: receiver }
spec:
  selector: { app: receiver }
  ports:
    - { name: http, port: 9000, targetPort: http }
---
# The exception that lets workers reach the receiver (everything else about their egress is unchanged).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: worker-to-receiver, namespace: webhooks }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: webhook-worker }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: receiver }
      ports:
        - { protocol: TCP, port: 9000 }
