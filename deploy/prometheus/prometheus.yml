global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:9090"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9090"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
