# NOT part of the kustomization: it only documents the Secrets the workloads
# expect. Create them with your secret manager (External Secrets, Sealed
# Secrets, Vault, ...), never commit real values.
#
# Three database logins, so that a compromised service holds only its own
# privileges (see docs/architecture.md, "Row-level security"):
#   webhook-db-api     login user that is a member of ONLY the webhooks_api role (and DB_ROLE=none)
#   webhook-db-worker  login user that is a member of ONLY the webhooks_worker role
#   webhook-db-owner   the table owner, used by the migrate Job (needs CREATEROLE for migration 00004)
apiVersion: v1
kind: Secret
metadata: { name: webhook-db-api }
stringData:
  DATABASE_URL: "postgres://webhooks_api_login:CHANGE_ME@postgres.database.svc:5432/webhooks?sslmode=verify-full"
---
apiVersion: v1
kind: Secret
metadata: { name: webhook-db-worker }
stringData:
  DATABASE_URL: "postgres://webhooks_worker_login:CHANGE_ME@postgres.database.svc:5432/webhooks?sslmode=verify-full"
---
apiVersion: v1
kind: Secret
metadata: { name: webhook-db-owner }
stringData:
  DATABASE_URL: "postgres://webhooks_owner:CHANGE_ME@postgres.database.svc:5432/webhooks?sslmode=verify-full"
---
# TLS to the database. Use sslmode=verify-full in the URLs above (never "require", which
# encrypts but does not check who it is talking to). If the database's CA is not in the
# public trust store, put it in this Secret and append
#   &sslrootcert=/etc/webhook/db-ca/ca.crt
# to each DATABASE_URL; the Deployments and the migrate Job mount it read-only. The host in
# the URL must match a name in the server certificate.
apiVersion: v1
kind: Secret
metadata: { name: webhook-db-ca }
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    CHANGE_ME
    -----END CERTIFICATE-----
---
# Key-encryption keys for endpoint signing secrets: "id:base64key[,id:base64key...]".
# The first is used to encrypt; the others only to decrypt (during key rotation).
# Generate one with: go run ./cmd/admin gen-secret-key k1
apiVersion: v1
kind: Secret
metadata: { name: webhook-encryption }
stringData:
  SECRET_ENCRYPTION_KEYS: "k1:CHANGE_ME_BASE64_32_BYTES"
