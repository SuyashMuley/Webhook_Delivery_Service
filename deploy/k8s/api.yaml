apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-api
  labels: { app.kubernetes.io/name: webhook-api, app.kubernetes.io/part-of: webhook-delivery }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop capacity during a rollout: new pods must be ready first
      maxSurge: 1
  selector:
    matchLabels: { app.kubernetes.io/name: webhook-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: webhook-api, app.kubernetes.io/part-of: webhook-delivery }
    spec:
      serviceAccountName: webhook-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45   # > SHUTDOWN_DRAIN_DELAY + connection drain
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: webhook-api }
      containers:
        - name: api
          image: webhook-delivery-api:latest
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: webhook-config }
            - secretRef: { name: webhook-db-api }
            - secretRef: { name: webhook-encryption }
          env:
            - name: DB_ROLE
              value: "none"   # the login user already holds only webhooks_api; no SET ROLE needed
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:   # also fails while draining and while the database is unreachable
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: db-ca, mountPath: /etc/webhook/db-ca, readOnly: true }
      volumes:
        # Optional CA bundle for sslmode=verify-full against a database whose CA is not publicly
        # trusted. Create the Secret `webhook-db-ca` with a `ca.crt` key and add
        # sslrootcert=/etc/webhook/db-ca/ca.crt to DATABASE_URL (see secret.example.yaml).
        - name: db-ca
          secret: { secretName: webhook-db-ca, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-api
  labels: { app.kubernetes.io/name: webhook-api }
spec:
  selector: { app.kubernetes.io/name: webhook-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Separate headless Service for metrics so they are never routed through the public Service.
apiVersion: v1
kind: Service
metadata:
  name: webhook-api-metrics
  labels: { app.kubernetes.io/name: webhook-api, app.kubernetes.io/component: metrics }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: webhook-api }
  ports:
    - { name: metrics, port: 9090, targetPort: metrics }
