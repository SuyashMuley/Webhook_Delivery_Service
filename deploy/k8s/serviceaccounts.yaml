# The services never call the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata: { name: webhook-api }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: webhook-worker }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: webhook-migrate }
automountServiceAccountToken: false
